name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Restore Keystore & Configuration
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "debug.keystore restored successfully"
        fi
        if [ ! -f .env ]; then
          cp .env.example .env 2>/dev/null || touch .env
          echo ".env prepared"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk AI-Image-To-Text-Scanner.apk
        ls -lh AI-Image-To-Text-Scanner.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-Image-To-Text-Scanner-APK
        path: AI-Image-To-Text-Scanner.apk

    - name: Publish GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-build-${{ github.run_number }}"
        echo "Creating GitHub Release $TAG_NAME..."
        gh release create "$TAG_NAME" "AI-Image-To-Text-Scanner.apk" \
          --title "AI Image To Text Scanner (Build ${{ github.run_number }})" \
          --notes "### AI Image To Text Scanner — Recent Version
          - Custom Application Logo
          - Visual Laser Scanning Animation Overlay on Camera
          - Real-time OCR & Multi-page PDF Scanning
          - In-app AI Assistant & Translation" \
          --latest || true

