name: Build & Release Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Restore Keystore & Configuration
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "debug.keystore restored from base64"
        elif [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "debug.keystore generated"
        fi
        if [ ! -f .env ]; then
          cp .env.example .env 2>/dev/null || touch .env
          echo ".env prepared"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Prepare APK for Release
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/AI-Image-To-Text-Scanner.apk
        ls -lh release-output/AI-Image-To-Text-Scanner.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-Image-To-Text-Scanner-APK
        path: release-output/AI-Image-To-Text-Scanner.apk
        if-no-files-found: error

    - name: Publish GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0-b${{ github.run_number }}
        name: "AI Image To Text Scanner v1.0.0 (Build ${{ github.run_number }})"
        body: |
          ### AI Image To Text Scanner
          Direct APK download with updated custom logo and camera scanning animation.
          
          **Download & Install:**
          Tap `AI-Image-To-Text-Scanner.apk` below to download directly to your phone.
        files: release-output/AI-Image-To-Text-Scanner.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true


