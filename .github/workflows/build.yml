name: Build & Release Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Restore Keystore & Configuration
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "debug.keystore restored from base64"
        elif [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "debug.keystore generated"
        fi
        if [ ! -f .env ]; then
          cp .env.example .env 2>/dev/null || touch .env
          echo ".env prepared"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Prepare APK for Release
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/AI-Image-To-Text-Scanner.apk
        ls -lh release-output/AI-Image-To-Text-Scanner.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-Image-To-Text-Scanner-APK
        path: release-output/AI-Image-To-Text-Scanner.apk
        if-no-files-found: error

    - name: Publish GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0-build-${{ github.run_number }}"
        echo "Publishing release $TAG_NAME..."
        gh release create "$TAG_NAME" "release-output/AI-Image-To-Text-Scanner.apk" \
          --title "AI Image To Text Scanner (Build ${{ github.run_number }})" \
          --notes "AI Image To Text Scanner latest version with custom logo and camera scanning animation overlay." || echo "GitHub release creation finished. APK is also available in Artifacts."


